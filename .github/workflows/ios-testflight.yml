# iOS build → TestFlight (Mac gerekmez; GitHub'ın macOS makinesinde derlenir)
#
# Tetikleme: `ios-*` etiketi push'la (ör. git tag ios-1 && git push origin ios-1)
#            veya varsayılan dalda Actions → "iOS TestFlight" → Run workflow.
#
# Gerekli repo secret'ları (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID   Apple Developer Team ID (10 karakter, developer.apple.com → Membership)
#   ASC_KEY_ID      App Store Connect API anahtar ID'si
#   ASC_ISSUER_ID   App Store Connect Issuer ID
#   ASC_KEY_P8      .p8 dosyasının TÜM içeriği (-----BEGIN PRIVATE KEY----- dahil)
# API anahtarı "Admin" rolünde olmalı: imza sertifikası/profil bulutta otomatik oluşturulur.
name: iOS TestFlight

on:
  push:
    tags: ["ios-*"]
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "false" # CRA: uyarıları hata sayma
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install
        run: yarn install --frozen-lockfile --network-timeout 600000

      - name: Build web bundle
        run: yarn build:mobile

      - name: Capacitor sync (iOS)
        run: npx cap sync ios

      - name: App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Archive
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${KID}.p8" \
            -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Export + upload to TestFlight
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${KID}.p8" \
            -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS"

      - name: Cleanup key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
