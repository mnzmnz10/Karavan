# iOS build → TestFlight (Mac gerekmez; GitHub'ın macOS makinesinde derlenir)
#
# Tetikleme: `ios-*` etiketi push'la (ör. git tag ios-1 && git push origin ios-1)
#            veya varsayılan dalda Actions → "iOS TestFlight" → Run workflow.
#
# Gerekli repo secret'ları (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID   Apple Developer Team ID (10 karakter, developer.apple.com → Membership)
#   ASC_KEY_ID      App Store Connect API anahtar ID'si
#   ASC_ISSUER_ID   App Store Connect Issuer ID
#   ASC_KEY_P8      .p8 dosyasının TÜM içeriği (-----BEGIN PRIVATE KEY----- dahil)
# API anahtarı "Admin" rolünde olmalı: imza sertifikası/profil bulutta otomatik oluşturulur.
name: iOS TestFlight

on:
  push:
    tags: ["ios-*"]
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "false" # CRA: uyarıları hata sayma
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install
        run: yarn install --frozen-lockfile --network-timeout 600000

      - name: Build web bundle
        run: yarn build:mobile

      - name: Capacitor sync (iOS)
        run: npx cap sync ios

      - name: Check secrets (lengths only, values never printed)
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          echo "APPLE_TEAM_ID length: ${#TEAM} (expected 10)"
          echo "ASC_KEY_ID length: ${#KID} (expected 10)"
          echo "ASC_ISSUER_ID length: ${#ISS} (expected 36)"
          echo "ASC_KEY_P8 length: ${#P8}; begins with PEM header: $([[ "$P8" == -----BEGIN* ]] && echo yes || echo no)"
          [ -n "$TEAM" ] && [ -n "$KID" ] && [ -n "$ISS" ] && [ -n "$P8" ] || { echo "::error::A required secret is empty"; exit 1; }

      - name: App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM_RAW: ${{ secrets.APPLE_TEAM_ID }}
          KID_RAW: ${{ secrets.ASC_KEY_ID }}
          ISS_RAW: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # Kimliklerde yalnız harf/rakam(/tire) kalsın: yapıştırırken gelen [ ] " ' ve boşluklar atılır
          TEAM=$(printf '%s' "$TEAM_RAW" | tr -cd 'A-Za-z0-9')
          KID=$(printf '%s' "$KID_RAW" | tr -cd 'A-Za-z0-9')
          ISS=$(printf '%s' "$ISS_RAW" | tr -cd 'A-Za-z0-9-')
          for v in "$TEAM" "$KID" "$ISS"; do echo "::add-mask::$v"; done
          echo "Cleaned lengths: team=${#TEAM} key=${#KID} issuer=${#ISS} (expected 10/10/36)"
          { echo "TEAM=$TEAM"; echo "KID=$KID"; echo "ISS=$ISS"; } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${KID}.p8"

      - name: Verify API key (status + Apple error only)
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography 2>/dev/null || python3 -m pip install --quiet pyjwt cryptography
          python3 - <<'PY'
          import os, time, json, urllib.request, urllib.error, jwt
          kid, iss = os.environ["KID"], os.environ["ISS"]
          key = open(os.path.join(os.environ["RUNNER_TEMP"], "keys", f"AuthKey_{kid}.p8")).read()
          tok = jwt.encode({"iss": iss, "iat": int(time.time()), "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"},
                           key, algorithm="ES256", headers={"kid": kid, "typ": "JWT"})
          for url in ("https://api.appstoreconnect.apple.com/v1/apps?limit=5",
                      "https://api.appstoreconnect.apple.com/v1/bundleIds?filter[identifier]=shop.corlukaravan.app"):
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {tok}"})
              try:
                  with urllib.request.urlopen(req) as r:
                      d = json.load(r)
                      print(url.split("/v1/")[1].split("?")[0], r.status, [x["attributes"].get("bundleId") or x["attributes"].get("identifier") for x in d.get("data", [])])
              except urllib.error.HTTPError as e:
                  body = e.read().decode()[:600]
                  print(url.split("/v1/")[1].split("?")[0], e.code, body)
          PY

      - name: Archive
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${KID}.p8" \
            -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic CODE_SIGN_IDENTITY="Apple Distribution" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Export + upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${KID}.p8" \
            -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS"

      - name: Cleanup key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
