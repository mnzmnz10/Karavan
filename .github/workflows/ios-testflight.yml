# iOS build → TestFlight (Mac gerekmez; GitHub'ın macOS makinesinde derlenir)
#
# Tetikleme: `ios-*` etiketi push'la (ör. git tag ios-1 && git push origin ios-1)
#            veya Actions → "iOS TestFlight" → Run workflow.
# Bundle ID (com.mnzmnz10.lkm) yoksa ilk çalıştırmada API ile kaydedilir; App Store
# Connect'te "Kontrol Merkezi" uygulama kaydı ise bir kez elle açılmalıdır (API bunu yapamaz).
#
# Gerekli repo secret'ları (Settings → Secrets and variables → Actions) — Karavan ile aynı değerler:
#   APPLE_TEAM_ID   Apple Developer Team ID (10 karakter, developer.apple.com → Membership)
#   ASC_KEY_ID      App Store Connect API anahtar ID'si
#   ASC_ISSUER_ID   App Store Connect Issuer ID
#   ASC_KEY_P8      .p8 dosyasının TÜM içeriği (-----BEGIN PRIVATE KEY----- dahil)
# API anahtarı "Admin" rolünde olmalı: imza sertifikası/profil bulutta otomatik oluşturulur.
name: iOS TestFlight

on:
  push:
    tags: ["ios-*"]
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      APP_BUNDLE_ID: com.mnzmnz10.lkm
      APP_NAME: Kontrol Merkezi
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Capacitor sync (iOS)
        run: npx cap sync ios

      - name: Check secrets (lengths only, values never printed)
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          echo "APPLE_TEAM_ID length: ${#TEAM} (expected 10)"
          echo "ASC_KEY_ID length: ${#KID} (expected 10)"
          echo "ASC_ISSUER_ID length: ${#ISS} (expected 36)"
          echo "ASC_KEY_P8 length: ${#P8}; begins with PEM header: $([[ "$P8" == -----BEGIN* ]] && echo yes || echo no)"
          [ -n "$TEAM" ] && [ -n "$KID" ] && [ -n "$ISS" ] && [ -n "$P8" ] || { echo "::error::A required secret is empty"; exit 1; }

      - name: App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM_RAW: ${{ secrets.APPLE_TEAM_ID }}
          KID_RAW: ${{ secrets.ASC_KEY_ID }}
          ISS_RAW: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # Kimliklerde yalnız harf/rakam(/tire) kalsın: yapıştırırken gelen [ ] " ' ve boşluklar atılır
          TEAM=$(printf '%s' "$TEAM_RAW" | tr -cd 'A-Za-z0-9')
          KID=$(printf '%s' "$KID_RAW" | tr -cd 'A-Za-z0-9')
          ISS=$(printf '%s' "$ISS_RAW" | tr -cd 'A-Za-z0-9-')
          for v in "$TEAM" "$KID" "$ISS"; do echo "::add-mask::$v"; done
          echo "Cleaned lengths: team=${#TEAM} key=${#KID} issuer=${#ISS} (expected 10/10/36)"
          { echo "TEAM=$TEAM"; echo "KID=$KID"; echo "ISS=$ISS"; } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${KID}.p8"

      - name: Verify API key + bundle ID + app record
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography 2>/dev/null || python3 -m pip install --quiet pyjwt cryptography
          python3 - <<'PY'
          import os, time, json, urllib.request, urllib.error, jwt
          kid, iss = os.environ["KID"], os.environ["ISS"]
          key = open(os.path.join(os.environ["RUNNER_TEMP"], "keys", f"AuthKey_{kid}.p8")).read()
          tok = jwt.encode({"iss": iss, "iat": int(time.time()), "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"},
                           key, algorithm="ES256", headers={"kid": kid, "typ": "JWT"})
          bid = os.environ["APP_BUNDLE_ID"]
          name = os.environ["APP_NAME"]

          def api(method, path, body=None):
              req = urllib.request.Request("https://api.appstoreconnect.apple.com" + path, method=method,
                                           data=json.dumps(body).encode() if body else None,
                                           headers={"Authorization": f"Bearer {tok}", "Content-Type": "application/json"})
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          # 1) Anahtar çalışıyor mu? (yalnız durum kodu ve Apple'ın hata metni yazılır)
          try:
              d = api("GET", "/v1/apps?limit=5")
              print("apps 200", [x["attributes"].get("bundleId") for x in d.get("data", [])])
          except urllib.error.HTTPError as e:
              print("::error::API key rejected:", e.code, e.read().decode()[:600]); raise SystemExit(1)

          # 2) Bundle ID kayıtlı değilse kaydet (Developer portal → Identifiers)
          found = api("GET", f"/v1/bundleIds?filter[identifier]={bid}").get("data", [])
          if any(x["attributes"]["identifier"] == bid for x in found):
              print("Bundle ID already registered:", bid)
          else:
              try:
                  api("POST", "/v1/bundleIds", {"data": {"type": "bundleIds", "attributes": {"identifier": bid, "name": name, "platform": "IOS"}}})
                  print("Registered bundle ID", bid)
              except urllib.error.HTTPError as e:
                  print("::error::Bundle ID could not be registered:", e.code, e.read().decode()[:400]); raise SystemExit(1)

          # 3) App Store Connect uygulama kaydı var mı? (API ile oluşturulamaz)
          apps = api("GET", f"/v1/apps?filter[bundleId]={bid}").get("data", [])
          if not apps:
              print(f"::error::App Store Connect'te {bid} için uygulama kaydı yok. Apps → + → New App ile '{name}' oluşturun (Bundle ID: {bid}), sonra iş akışını yeniden çalıştırın.")
              raise SystemExit(1)
          print("App record OK:", apps[0]["attributes"]["name"])
          PY

      - name: Archive
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${KID}.p8" \
            -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Export + upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${KID}.p8" \
            -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS"

      - name: Cleanup key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
