# TestFlight'taki bir build'i App Store incelemesine gönderir (Mac gerekmez).
#
# Tetikleme:
#   submit-N    etiketi (ör. git tag submit-1 && git push origin submit-1): sürümün en yeni build'i.
#   submit-bNN  etiketi (ör. submit-b26): tam olarak NN numaralı build gönderilir; o sürüm
#               başka bir build'le WAITING_FOR_REVIEW durumundaysa o gönderim iptal edilip
#               yerine bu build gönderilir.
#   Actions → "App Store submit" → Run workflow: version / build_number / replace girilebilir.
# build_number boşsa: sürümün sayıca en büyük build'i seçilir. ios-testflight'ın daha yeni bir
#   (beta olmayan, başarılı ya da süren) koşusu varsa onun build numarası beklenir.
# Seçilen build VALID olana (ve henüz görünmüyorsa görünene) kadar en çok ~30 dk beklenir.
# Sürüm yayın türü MANUAL: onaydan sonra App Store Connect'ten elle yayınlanır.
# Dağıtım/fiyat/erişilebilirlik ayarlarına dokunulmaz (uygulama unlisted kalır).
#
# Secret'lar ios-testflight.yml ile aynı: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (değerleri yazdırılmaz).
name: App Store submit

on:
  push:
    tags: ["submit-*"]
  workflow_dispatch:
    inputs:
      version:
        description: "App Store sürümü (MARKETING_VERSION)"
        default: ""
        required: false
      build_number:
        description: "Build numarası (ios-testflight run_number); boş = sürümün en yeni build'i"
        default: ""
        required: false
      replace:
        description: "İncelemede bekleyen gönderimi iptal edip bu build'le yeniden gönder"
        type: boolean
        default: false

concurrency:
  group: appstore-submit
  cancel-in-progress: false

permissions:
  actions: read # ios-testflight koşularını okumak için

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: frontend/ios/App/App.xcodeproj
      - name: Submit build for App Store review
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          KID_RAW: ${{ secrets.ASC_KEY_ID }}
          ISS_RAW: ${{ secrets.ASC_ISSUER_ID }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          BID: shop.corlukaravan.app
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number || '' }}
          REPLACE: ${{ inputs.replace && 'true' || 'false' }}
          WHATS_NEW: "Uygulama artık arayüz güncellemelerini kendisi indiriyor; yeni ekranlar ve düzeltmeler mağaza güncellemesi beklemeden gelir. Hesap ekranında çalışan sürüm görünüyor."
        run: |
          pip install --quiet pyjwt cryptography
          python3 - <<'PY'
          import os, time, json, re, urllib.request, urllib.error, urllib.parse, jwt

          kid = re.sub(r"[^A-Za-z0-9]", "", os.environ["KID_RAW"])
          iss = re.sub(r"[^A-Za-z0-9-]", "", os.environ["ISS_RAW"])
          bid, version = os.environ["BID"], (os.environ["VERSION"].strip() or __import__("re").search(r"MARKETING_VERSION = ([0-9.]+);", open("frontend/ios/App/App.xcodeproj/project.pbxproj").read()).group(1))
          build_number = os.environ["BUILD_NUMBER"].strip()
          replace = os.environ["REPLACE"] == "true"
          whats_new = os.environ["WHATS_NEW"]
          m = re.fullmatch(r"submit-b(\d+)", os.environ["REF_NAME"]) if os.environ["EVENT"] == "push" else None
          if m:
              build_number = m.group(1)
          explicit_build = bool(build_number)
          print(f"version={version} build_number={build_number or '(latest)'} replace={replace}")

          def token():
              # Token en çok 20 dk geçerli; build beklerken süre dolmasın diye her çağrıda yeniden üretilir.
              now = int(time.time())
              return jwt.encode({"iss": iss, "iat": now, "exp": now + 900, "aud": "appstoreconnect-v1"},
                                os.environ["ASC_KEY_P8"], algorithm="ES256", headers={"kid": kid, "typ": "JWT"})

          def fail(msg):
              print(f"::error::{msg}")
              raise SystemExit(1)

          def api(method, path, body=None, step=""):
              req = urllib.request.Request("https://api.appstoreconnect.apple.com" + path, method=method,
                                           data=json.dumps(body).encode() if body else None,
                                           headers={"Authorization": f"Bearer {token()}", "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req) as r:
                      t = r.read()
                      return json.loads(t) if t else {}
              except urllib.error.HTTPError as e:
                  raw = e.read().decode(errors="replace")
                  try:
                      details = [f"{x.get('code')}: {x.get('detail') or x.get('title')}" for x in json.loads(raw).get("errors", [])]
                  except ValueError:
                      details = [raw[:500]]
                  for d in details:
                      print(f"  Apple: {d}")
                  fail(f"{step or method + ' ' + path.split('?')[0]} failed (HTTP {e.code}): {'; '.join(details)[:400]}")

          q = urllib.parse.quote
          EDITABLE = {"PREPARE_FOR_SUBMISSION", "DEVELOPER_REJECTED", "REJECTED", "METADATA_REJECTED", "INVALID_BINARY", "READY_FOR_REVIEW"}

          def vstate(v):
              return v["attributes"].get("appStoreState") or v["attributes"].get("appVersionState")

          # 1) Uygulama
          apps = api("GET", f"/v1/apps?filter[bundleId]={bid}", step="find app")["data"]
          app = next((a for a in apps if a["attributes"]["bundleId"] == bid), None)
          if not app:
              fail(f"No app for bundle ID {bid}")
          app_id = app["id"]
          print("App:", app["attributes"]["name"], app_id)

          def list_builds():
              path = f"/v1/builds?filter[app]={app_id}&filter[preReleaseVersion.version]={q(version)}&limit=50"
              if build_number:
                  path += f"&filter[version]={q(build_number)}"
              blds = [b for b in api("GET", path, step="list builds")["data"] if not b["attributes"].get("expired")]
              return sorted(blds, key=lambda b: int(b["attributes"]["version"]) if str(b["attributes"].get("version")).isdigit() else -1,
                            reverse=True)

          # 2) Varsayılan yolda koruma: ios-testflight'ın en yeni (beta olmayan) koşusu ASC'de görünen
          #    en büyük build'den yeniyse (yükleme ASC'ye henüz düşmemiş) o build numarasını bekle.
          if not build_number:
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['REPO']}/actions/workflows/ios-testflight.yml/runs?per_page=30",
                  headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"})
              try:
                  with urllib.request.urlopen(req) as r:
                      runs = json.load(r)["workflow_runs"]
              except urllib.error.HTTPError as e:
                  fail(f"Could not read ios-testflight runs (HTTP {e.code}); pass build_number explicitly")
              runs = [x for x in runs if not (x.get("head_branch") or "").startswith("beta-")
                      and (x["status"] != "completed" or x.get("conclusion") == "success")]
              newest_run = max((x["run_number"] for x in runs), default=0)
              blds = list_builds()
              top = int(blds[0]["attributes"]["version"]) if blds else 0
              print(f"Newest ios-testflight run: #{newest_run}; highest ASC build for {version}: {top or 'none'}")
              if newest_run > top:
                  build_number = str(newest_run)
                  print(f"ASC does not show build {build_number} yet; waiting for it")

          # 3) Build'i bul ve VALID olana kadar bekle (görünmüyorsa görünene kadar da; en çok ~30 dk)
          deadline = time.time() + 30 * 60
          while True:
              blds = list_builds()
              build = blds[0] if blds else None
              st = build["attributes"].get("processingState") if build else None
              if build:
                  print(f"Build {version} ({build['attributes'].get('version')}): {build['id']} processingState={st}")
              else:
                  print(f"Build {version} ({build_number or 'latest'}) not visible in App Store Connect yet")
              if st == "VALID":
                  break
              if st in ("FAILED", "INVALID"):
                  fail(f"Build processing ended with {st}")
              if time.time() > deadline:
                  fail("Timed out (~30 min) waiting for build to appear and become VALID")
              time.sleep(60)
          build_id = build["id"]
          build_ver = build["attributes"].get("version")

          # 4) App Store sürümü (iOS, versionString); yoksa oluştur
          def get_version():
              vs = api("GET", f"/v1/apps/{app_id}/appStoreVersions?filter[platform]=IOS&filter[versionString]={q(version)}&limit=5",
                       step="find appStoreVersion")["data"]
              return vs[0] if vs else None

          def sub_has_version(sub_id, ver_id):
              items = api("GET", f"/v1/reviewSubmissions/{sub_id}/items?include=appStoreVersion&limit=50",
                          step="list submission items")["data"]
              return any((((i.get("relationships") or {}).get("appStoreVersion") or {}).get("data") or {}).get("id") == ver_id
                         for i in items)

          ver = get_version()
          if ver:
              state = vstate(ver)
              print(f"appStoreVersion {version}: {ver['id']} state={state}")
              if state == "WAITING_FOR_REVIEW":
                  cur = api("GET", f"/v1/appStoreVersions/{ver['id']}/build", step="get attached build").get("data")
                  cur_ver = cur["attributes"].get("version") if cur else None
                  print(f"Build attached to waiting version: {cur_ver}")
                  if not (replace or (explicit_build and cur_ver != build_ver)):
                      print(f"Version {version} is already waiting for review with build {cur_ver}; nothing to do.")
                      raise SystemExit(0)
                  # Bekleyen gönderimi iptal et, CANCELING bitene kadar bekle
                  waiting = api("GET", f"/v1/reviewSubmissions?filter[app]={app_id}&filter[platform]=IOS"
                                       f"&filter[state]=WAITING_FOR_REVIEW&limit=20", step="list waiting submissions")["data"]
                  old = next((s for s in waiting if sub_has_version(s["id"], ver["id"])), None)
                  if not old:
                      fail("Version is WAITING_FOR_REVIEW but no waiting reviewSubmission holds it")
                  print(f"Canceling submission {old['id']} (build {cur_ver}) to replace with build {build_ver}")
                  api("PATCH", f"/v1/reviewSubmissions/{old['id']}", {"data": {"type": "reviewSubmissions", "id": old["id"],
                      "attributes": {"canceled": True}}}, step="cancel submission")
                  cdeadline = time.time() + 10 * 60
                  while True:
                      sst = api("GET", f"/v1/reviewSubmissions/{old['id']}", step="poll canceled submission")["data"]["attributes"].get("state")
                      ver = get_version()
                      state = vstate(ver)
                      print(f"  submission state={sst}, version state={state}")
                      if sst != "CANCELING" and state in EDITABLE:
                          break
                      if time.time() > cdeadline:
                          fail(f"Timed out (~10 min) after cancel: submission={sst}, version={state}")
                      time.sleep(20)
              elif state in {"IN_REVIEW", "PENDING_DEVELOPER_RELEASE", "PROCESSING_FOR_APP_STORE"}:
                  if replace or explicit_build:
                      fail(f"Version {version} is {state}; it can no longer be replaced from CI")
                  print(f"Version {version} is already {state}; nothing to do.")
                  raise SystemExit(0)
              if state not in EDITABLE:
                  fail(f"Version {version} is in state {state}, not editable (bump MARKETING_VERSION?)")
              if ver["attributes"].get("releaseType") != "MANUAL":
                  api("PATCH", f"/v1/appStoreVersions/{ver['id']}", {"data": {"type": "appStoreVersions", "id": ver["id"],
                      "attributes": {"releaseType": "MANUAL"}}}, step="set releaseType MANUAL")
                  print("releaseType -> MANUAL")
          else:
              ver = api("POST", "/v1/appStoreVersions", {"data": {"type": "appStoreVersions",
                  "attributes": {"platform": "IOS", "versionString": version, "releaseType": "MANUAL"},
                  "relationships": {"app": {"data": {"type": "apps", "id": app_id}}}}}, step="create appStoreVersion")["data"]
              print(f"Created appStoreVersion {version}: {ver['id']}")
          ver_id = ver["id"]

          # 5) Şifreleme beyanı (Info.plist'te ITSAppUsesNonExemptEncryption=false var; boşsa API ile ayarla)
          if build["attributes"].get("usesNonExemptEncryption") is None:
              api("PATCH", f"/v1/builds/{build_id}", {"data": {"type": "builds", "id": build_id,
                  "attributes": {"usesNonExemptEncryption": False}}}, step="set usesNonExemptEncryption")
              print("usesNonExemptEncryption -> false")
          else:
              print("usesNonExemptEncryption:", build["attributes"]["usesNonExemptEncryption"])

          # 6) Build'i sürüme bağla
          api("PATCH", f"/v1/appStoreVersions/{ver_id}/relationships/build",
              {"data": {"type": "builds", "id": build_id}}, step="attach build to version")
          print(f"Build {build_ver} attached to version {version}")

          # 7) What's New (tüm mevcut localization'lar)
          locs = api("GET", f"/v1/appStoreVersions/{ver_id}/appStoreVersionLocalizations?limit=50", step="list localizations")["data"]
          if not locs:
              fail("Version has no localizations (whatsNew could not be set)")
          for loc in locs:
              api("PATCH", f"/v1/appStoreVersionLocalizations/{loc['id']}", {"data": {"type": "appStoreVersionLocalizations",
                  "id": loc["id"], "attributes": {"whatsNew": whats_new}}}, step=f"set whatsNew ({loc['attributes'].get('locale')})")
              print("whatsNew set:", loc["attributes"].get("locale"))

          # 8) reviewSubmission: açık olanı kullan ya da oluştur, sürümü ekle, gönder
          subs = api("GET", f"/v1/reviewSubmissions?filter[app]={app_id}&filter[platform]=IOS"
                            f"&filter[state]=READY_FOR_REVIEW,WAITING_FOR_REVIEW,IN_REVIEW,UNRESOLVED_ISSUES&limit=20",
                     step="list reviewSubmissions")["data"]
          for s in subs:
              print("Open reviewSubmission:", s["id"], s["attributes"].get("state"))
          sub = next((s for s in subs if s["attributes"].get("state") in ("READY_FOR_REVIEW", "UNRESOLVED_ISSUES")), None)
          busy = next((s for s in subs if s["attributes"].get("state") in ("WAITING_FOR_REVIEW", "IN_REVIEW")), None)
          if not sub and busy:
              fail(f"Another submission is already {busy['attributes']['state']} ({busy['id']}); cancel it in App Store Connect first")
          if not sub:
              sub = api("POST", "/v1/reviewSubmissions", {"data": {"type": "reviewSubmissions", "attributes": {"platform": "IOS"},
                  "relationships": {"app": {"data": {"type": "apps", "id": app_id}}}}}, step="create reviewSubmission")["data"]
              print("Created reviewSubmission:", sub["id"])
          sub_id = sub["id"]

          if sub_has_version(sub_id, ver_id):
              print("Version already in submission")
          else:
              api("POST", "/v1/reviewSubmissionItems", {"data": {"type": "reviewSubmissionItems", "relationships": {
                  "reviewSubmission": {"data": {"type": "reviewSubmissions", "id": sub_id}},
                  "appStoreVersion": {"data": {"type": "appStoreVersions", "id": ver_id}}}}}, step="add version to submission")
              print("Version added to submission")

          res = api("PATCH", f"/v1/reviewSubmissions/{sub_id}", {"data": {"type": "reviewSubmissions", "id": sub_id,
              "attributes": {"submitted": True}}}, step="submit for review")["data"]
          print(f"Submitted for review: submission {sub_id} state={res['attributes'].get('state')}, "
                f"version {version} build {build_ver} (releaseType MANUAL)")
          PY
